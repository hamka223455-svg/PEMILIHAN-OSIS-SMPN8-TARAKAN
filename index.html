<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3A2C96">
<title>Pemilihan Ketua OSIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: bilik suara layar penuh untuk satu Chromebook. Empat kartu foto paslon memenuhi layar (4 kolom di landscape), satu tombol kirim lebar di bawah. Setiap paslon punya warna sendiri untuk nomor dan pilihan. */
:root {
  color-scheme: light;
  --bg: #F2F3F8;
  --surface: #FFFFFF;
  --fg: #15152B;
  --muted: #5B5D78;
  --line: #D5D7E4;
  --ink: #3A2C96;
  --ink-fg: #FFFFFF;
  --ink-soft: #E4E2F4;
  --bad: #B3261E;
  --warn: #8F5600;
  --p1: #4338CA;
  --p2: #0E7C86;
  --p3: #B45309;
  --p4: #A21CAF;
  --pfg: #FFFFFF;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0F1020;
    --surface: #181A30;
    --fg: #ECEDF7;
    --muted: #9EA1BF;
    --line: #2D3052;
    --ink: #A599FF;
    --ink-fg: #14102E;
    --ink-soft: #26224E;
    --bad: #FF8A80;
    --warn: #E0A94A;
    --p1: #8B93FF;
    --p2: #35C4D0;
    --p3: #F2A44B;
    --p4: #E879F9;
    --pfg: #14102E;
  }
}

* { box-sizing: border-box; }
html { height: 100%; }
body {
  margin: 0;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.5 var(--body);
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
.wrap { flex: 1; width: 100%; max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; min-width: 0; }
body::before { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; background: var(--logo) center / min(86vmin, 820px) no-repeat; opacity: .08; }
.wrap { position: relative; z-index: 1; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

.brand { display: flex; align-items: center; gap: 12px; padding-bottom: 10px; min-width: 0; }
.brand img { height: clamp(40px, 7vh, 72px); width: auto; aspect-ratio: 1; flex: none; }
.brand .bt { min-width: 0; line-height: 1.1; }
.brand .bt b { display: block; font-family: var(--display); font-weight: 800; font-size: clamp(1.4rem, 3.4vh, 2.3rem); text-transform: uppercase; }
.brand .bt span { font-size: .85rem; color: var(--muted); font-weight: 600; }
.tlogo { display: block; width: clamp(90px, 20vh, 200px); height: auto; aspect-ratio: 1; margin: 0 auto 6px; }
.kiosk { flex: 1; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.ballot { flex: 1; display: grid; grid-template-columns: 1fr; grid-auto-rows: minmax(0, 1fr); gap: clamp(10px, 1.4vw, 20px); min-height: 0; }
@media (min-width: 560px) { .ballot { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 600px) and (orientation: landscape), (min-width: 1000px) { .ballot { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (orientation: portrait) { .ballot { grid-auto-rows: auto; } .fotowrap { min-height: 220px; } }

.card {
  position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0;
  background: var(--surface); border: 3px solid var(--line); border-radius: 12px; overflow: hidden;
  cursor: pointer; user-select: none; -webkit-user-select: none;
  transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
}
.card:active { transform: scale(.99); }
.card.sel { border-color: var(--pc); box-shadow: 0 0 0 4px var(--pc); }
.card:has(input:focus-visible) { outline: 3px solid var(--ink); outline-offset: 4px; }
.fotowrap { position: relative; display: block; flex: 1; min-height: clamp(110px, 24vh, 560px); background: var(--ink-soft); }
.foto { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
.ph svg { width: 38%; max-width: 160px; height: auto; }
.chip {
  position: absolute; left: 10px; top: 10px; display: grid; justify-items: center; line-height: 1;
  padding: 8px 14px 6px; border-radius: 8px; background: var(--pc); color: var(--pfg);
}
.chip small { font-size: .62rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
.chip b { font-family: var(--display); font-weight: 800; font-size: clamp(2.4rem, 7vh, 4.6rem); line-height: .9; }
.tick {
  position: absolute; right: 10px; top: 10px; width: 48px; height: 48px; border-radius: 50%;
  background: var(--surface); border: 3px solid var(--line); display: grid; place-items: center; color: transparent;
}
.card.sel .tick { background: var(--pc); border-color: var(--pc); color: var(--pfg); }
.cap { display: grid; padding: 12px 16px 16px; }
.role { font-size: .72rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.role:first-child { margin-top: 0; }
.name { font-weight: 700; font-size: clamp(1.05rem, 2.1vw, 1.65rem); line-height: 1.2; overflow-wrap: anywhere; }
.name.empty { color: var(--muted); font-weight: 400; font-style: italic; }

.sendbar { display: grid; gap: 8px; }
.send {
  appearance: none; width: 100%; min-height: 72px; padding: 14px 20px; border-radius: 12px;
  font: 700 clamp(1.15rem, 2.4vw, 1.6rem) var(--body); cursor: pointer;
  border: 3px solid var(--pc, var(--ink)); background: var(--pc, var(--ink)); color: var(--pfg, var(--ink-fg));
}
.send:disabled { background: var(--surface); color: var(--muted); border-color: var(--line); cursor: not-allowed; }
.err { margin: 0; color: var(--bad); font-weight: 600; text-align: center; }

.thanks {
  position: fixed; inset: 0; z-index: 30; display: grid; place-content: center; gap: 10px; text-align: center;
  background: var(--ink); color: var(--ink-fg); cursor: pointer;
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px));
  animation: pop .25s ease-out;
}
.thanks .okc { width: clamp(72px, 14vh, 140px); height: clamp(72px, 14vh, 140px); border-radius: 50%; margin: 0 auto 6px; display: grid; place-items: center; border: 4px solid currentColor; }
.thanks .okc svg { width: 55%; height: 55%; }
.thanks h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(3rem, 12vw, 7.5rem); line-height: .9; text-transform: uppercase; }
.thanks p { margin: 0; font-size: clamp(1.1rem, 2.6vw, 1.7rem); }
@keyframes pop { from { opacity: 0; transform: scale(.98); } to { opacity: 1; transform: none; } }

.center { flex: 1; display: grid; place-content: center; text-align: center; gap: 6px; padding: 24px; }
.center h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(2.2rem, 7vw, 4.5rem); line-height: .95; text-transform: uppercase; }
.note { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; }
.note strong { display: block; color: var(--warn); }

#fsHint {
  position: fixed; z-index: 25; left: 50%; transform: translateX(-50%);
  top: calc(env(safe-area-inset-top, 0px) + 8px);
  padding: 6px 14px; border-radius: 999px; font-size: .85rem; font-weight: 600;
  background: var(--fg); color: var(--bg); opacity: .85; pointer-events: none; white-space: nowrap;
}
#fsHint[hidden] { display: none; }

@media (orientation: landscape) and (max-height: 560px) {
  body { padding-block: 8px; }
  .kiosk { gap: 8px; }
  .ballot { gap: 8px; }
  .fotowrap { min-height: 70px; }
  .cap { padding: 8px 12px 10px; }
  .chip { padding: 5px 10px 4px; }
  .tick { width: 36px; height: 36px; }
  .send { min-height: 56px; padding: 8px 16px; }
}
@media (orientation: landscape) and (max-height: 560px) { .brand { padding-bottom: 6px; } .brand img { height: 34px; } .brand .bt span { display: none; } .brand .bt b { font-size: 1.2rem; } }
@media (prefers-reduced-motion: reduce) { .card, .thanks { transition: none; animation: none; } }
</style>
</head>

";
document.documentElement.style.setProperty("--logo", 'url("' + LOGO + '")');
const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const PERSON = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="currentColor" opacity=".35"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8z" fill="currentColor" opacity=".35"/></svg>';

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function safeImg(d) {
  return (typeof d === "string" && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(d)) ? d : "";
}

let db = null;
const S = {
  cfg: null, fotos: ["", "", "", ""], open: true,
  sel: null, busy: false, err: "", thanks: false, tid: 0,
  pendingRef: null, retry: false, dberr: ""
};

function cfg() {
  const c = S.cfg || {};
  return [0, 1, 2, 3].map(function (i) {
    const x = (c.paslon || [])[i] || {};
    return { ketua: x.ketua || "" };
  });
}

/* ---------- layar penuh ---------- */
const fsOK = !!document.documentElement.requestFullscreen;
const hint = document.getElementById("fsHint");
function inFS() {
  return !!document.fullscreenElement ||
    (window.matchMedia && window.matchMedia("(display-mode: fullscreen), (display-mode: standalone)").matches);
}
function updateHint() { hint.hidden = !fsOK || inFS(); }
document.addEventListener("click", function () {
  if (fsOK && !document.fullscreenElement) {
    try {
      const p = document.documentElement.requestFullscreen({ navigationUI: "hide" });
      if (p && p.catch) p.catch(function () {});
    } catch (e) { /* abaikan */ }
  }
}, true);
document.addEventListener("fullscreenchange", updateHint);
updateHint();

/* ---------- tampilan ---------- */
function dbNote() {
  if (!S.dberr) return "";
  const hintText = S.dberr === "permission-denied"
    ? "Aturan Firestore menolak akses. Pasang aturan di Firebase, lalu muat ulang halaman."
    : "Firestore belum bisa dihubungi. Pastikan Firestore Database sudah dibuat di proyek Firebase.";
  return '<div class="note" role="alert"><strong>Tidak terhubung ke database</strong>' + esc(hintText) + ' (kode: ' + esc(S.dberr) + ')</div>';
}
function cardHTML(p, i) {
  const n = i + 1, on = S.sel === n, img = safeImg(S.fotos[i]);
  return '<label class="card' + (on ? " sel" : "") + '" data-n="' + n + '" style="--pc:var(--p' + n + ')">' +
    '<input class="sr" type="radio" name="paslon" value="' + n + '"' + (on ? " checked" : "") + '>' +
    '<span class="fotowrap">' +
      (img ? '<img class="foto" src="' + img + '" alt="Foto Paslon ' + n + '" draggable="false">' : '<span class="ph" aria-hidden="true">' + PERSON + '</span>') +
      '<span class="chip"><small>Paslon</small><b>' + n + '</b></span>' +
      '<span class="tick" aria-hidden="true">' + CHECK + '</span>' +
    '</span>' +
    '<span class="cap">' +
      '<span class="role">Ketua</span><span class="name' + (p.ketua ? "" : " empty") + '">' + esc(p.ketua || "Belum diisi") + '</span>' +
    '</span></label>';
}
function barHTML() {
  const label = S.busy ? "Mengirim…" : (S.sel ? "Kirim suara Paslon " + S.sel : "Pilih salah satu paslon");
  return '<button type="button" class="send" data-act="send"' + (S.sel ? ' style="--pc:var(--p' + S.sel + ')"' : "") +
    ((!S.sel || S.busy || S.thanks) ? " disabled" : "") + '>' + label + '</button>' +
    (S.err ? '<p class="err" role="alert">' + esc(S.err) + '</p>' : "");
}
function render() {
  if (!S.open) {
    app.innerHTML = '<div class="center"><img class="tlogo" src="' + LOGO + '" alt="Logo OSIS"><h2>Pemungutan suara ditutup</h2></div>' + dbNote();
    return;
  }
  const P = cfg();
  app.innerHTML = '<header class="brand"><img src="' + LOGO + '" alt="Logo OSIS SMPN 8 Tarakan"><div class="bt"><b>Pemilihan Ketua OSIS</b><span>' + esc((S.cfg && S.cfg.sekolah) || "") + '</span></div></header>' +
    '<div class="kiosk">' + dbNote() +
    '<div class="ballot" role="radiogroup" aria-label="Pilih satu pasangan calon">' + P.map(cardHTML).join("") + '</div>' +
    '<div class="sendbar" id="bar">' + barHTML() + '</div></div>' +
    (S.thanks ? '<div class="thanks" role="status" data-act="dismiss"><img class="tlogo" src="' + LOGO + '" alt=""><h2>Terima kasih</h2><p>Suara Anda sudah tercatat. Silakan keluar dari bilik.</p></div>' : "");
}
let queued = false;
function renderSoon() {
  if (queued) return;
  queued = true;
  requestAnimationFrame(function () { queued = false; render(); });
}
function updateSelection() {
  const cards = app.querySelectorAll(".card");
  for (let i = 0; i < cards.length; i++) {
    cards[i].classList.toggle("sel", Number(cards[i].getAttribute("data-n")) === S.sel);
  }
  const bar = document.getElementById("bar");
  if (bar) bar.innerHTML = barHTML();
}

/* ---------- aksi ---------- */
function errText(e) {
  if (e && e.code === "permission-denied") return "Suara ditolak server. Hubungi panitia.";
  return "Suara belum terkirim. Periksa internet lalu tekan tombol kirim lagi.";
}
function timeout(ms) {
  return new Promise(function (_, rej) { setTimeout(function () { rej({ code: "timeout" }); }, ms); });
}
async function sendVote() {
  if (S.busy || S.thanks || !S.sel || !db) return;
  S.busy = true; S.err = ""; updateSelection();
  if (!S.pendingRef) S.pendingRef = doc(collection(db, "votes"));
  let ok = false;
  try {
    await Promise.race([setDoc(S.pendingRef, { paslon: S.sel, at: new Date().toISOString() }), timeout(10000)]);
    ok = true;
  } catch (e) {
    /* Percobaan ulang ke dokumen yang sama: jika sudah tercatat, server menolak "ubah". Anggap berhasil. */
    if (S.retry && e && e.code === "permission-denied") ok = true;
    else { S.retry = true; S.err = errText(e); }
  }
  S.busy = false;
  if (ok) {
    S.sel = null; S.pendingRef = null; S.retry = false; S.thanks = true; render();
    const id = ++S.tid;
    setTimeout(function () { if (S.tid === id) { S.thanks = false; render(); } }, 2200);
  } else {
    updateSelection();
  }
}
app.addEventListener("click", function (ev) {
  const t = ev.target.closest("[data-act]");
  if (!t) return;
  const a = t.getAttribute("data-act");
  if (a === "send") sendVote();
  else if (a === "dismiss") { S.tid++; S.thanks = false; render(); }
});
app.addEventListener("change", function (ev) {
  const t = ev.target;
  if (t && t.name === "paslon") { S.sel = Number(t.value); S.err = ""; updateSelection(); }
});

/* ---------- mulai ---------- */
db = getFirestore(initializeApp(firebaseConfig));
const onErr = function (e) { S.dberr = (e && e.code) || "error"; renderSoon(); };
onSnapshot(doc(db, "config", "paslon"), function (s) { S.cfg = s.exists() ? s.data() : null; S.dberr = ""; renderSoon(); }, onErr);
onSnapshot(doc(db, "config", "status"), function (s) { S.open = s.exists() ? s.data().open !== false : true; renderSoon(); }, onErr);
[1, 2, 3, 4].forEach(function (n) {
  onSnapshot(doc(db, "config", "foto" + n), function (s) {
    S.fotos[n - 1] = s.exists() && s.data().data ? s.data().data : "";
    renderSoon();
  }, onErr);
});
render();
</script>

</html>
